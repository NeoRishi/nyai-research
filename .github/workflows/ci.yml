name: nyai-research-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scaffold-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fixture schema and evaluation guardrails
        run: python -m unittest discover -s tests -v
      - name: Replay recorded experiment evidence without credentials
        run: |
          python scripts/demo.py
          python scripts/summarize_pilot.py
          python scripts/verify_agentic.py
          python scripts/verify_artifacts.py
      - name: Verify the separate sanitized package in isolation
        run: |
          python scripts/build_review_bundle.py
          python scripts/check_review_bundle.py dist/NyAI_Reproducibility_Review_2026-10-25.zip
